<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lily</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0c1c; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  .hug { position: fixed; right: 2vmin; bottom: 2vmin; width: clamp(8px, 1.2vw, 13px); pointer-events: none;
         opacity: .92; animation: breathe 4.5s ease-in-out infinite; transform-origin: 50% 100%; }
  .hug img { display: block; width: 100%; height: auto;
             filter: drop-shadow(0 0 2px rgba(255,170,215,.9)) drop-shadow(0 0 10px rgba(255,100,170,.6)); }
  .hug::before { content: ""; position: absolute; inset: -40%; z-index: -1; border-radius: 50%;
                 background: radial-gradient(circle, rgba(255,105,165,.30), rgba(255,105,165,0) 65%); }
  @keyframes breathe { 50% { transform: scale(1.025); } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
// ---------------- Settings ----------------
const MESSAGE = "";            // optional permanent message at the bottom
const PALETTE = "stargazer";   // stargazer / white / tiger / violet
const ROT_SPEED = 0.55;
const ASPECT = 2, BASE_Y = 0.78;
const BG_TOP = [10, 12, 28], BG_BOT = [38, 22, 52];

const PALETTES = {
  stargazer: { t:[175,240,110], i:[255,70,165], m:[255,130,200], e:[255,232,246], f:[175,20,85], a:[255,175,40], ah:[255,235,110], ai:[215,105,255], ae:[255,215,245], msg:[255,105,165] },
  white:     { t:[185,245,120], i:[215,230,245], m:[238,244,255], e:[255,255,255], f:[175,210,155], a:[255,165,35], ah:[255,230,95], ai:[195,220,255], ae:[255,255,255], msg:[255,120,175] },
  tiger:     { t:[255,225,85], i:[255,95,40], m:[255,150,50], e:[255,220,125], f:[125,22,15], a:[220,55,35], ah:[255,195,70], ai:[255,120,75], ae:[255,235,155], msg:[255,135,105] },
  violet:    { t:[150,245,185], i:[165,85,255], m:[205,145,255], e:[240,225,255], f:[90,35,185], a:[255,195,65], ah:[255,240,145], ai:[255,115,200], ae:[245,220,255], msg:[235,125,255] },
};
const pal = PALETTES[PALETTE] || PALETTES.stargazer;

// ---------------- Helpers ----------------
const { sin, cos, sqrt, abs, PI } = Math, TAU = PI * 2;
const clamp = (v, lo, hi) => v < lo ? lo : v > hi ? hi : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const mod = (a, n) => ((a % n) + n) % n;
const mix = (c1, c2, t) => { t = clamp(t, 0, 1); return [Math.floor(c1[0] + (c2[0] - c1[0]) * t), Math.floor(c1[1] + (c2[1] - c1[1]) * t), Math.floor(c1[2] + (c2[2] - c1[2]) * t)]; };
const scale = (c, f) => [clamp(Math.floor(c[0] * f), 0, 255), clamp(Math.floor(c[1] * f), 0, 255), clamp(Math.floor(c[2] * f), 0, 255)];
const norm = v => { const l = sqrt(v[0]*v[0] + v[1]*v[1] + v[2]*v[2]); return l < 1e-9 ? [0, -1, 0] : [v[0]/l, v[1]/l, v[2]/l]; };
const cross = (a, b) => [a[1]*b[2] - a[2]*b[1], a[2]*b[0] - a[0]*b[2], a[0]*b[1] - a[1]*b[0]];
const WHITE = [255, 255, 255];

function rng(seed) { // small seeded random generator
  return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}

let wind = 0;
function proj(x, y, z, V) {
  let rx = x * V.rc + z * V.rs;
  const rz = -x * V.rs + z * V.rc;
  const lift = BASE_Y - y;
  if (lift > 0) rx += wind * lift * lift * 0.05;
  const persp = 4.2 / Math.max(0.8, 4.2 - rz);
  return [V.cx + rx * persp * V.unit * ASPECT, V.cy + y * persp * V.unit, rz, clamp(0.62 + 0.40 * ((rz + 0.85) / 1.70), 0.45, 1.08)];
}

class Grid {
  constructor(w, h) { this.w = w; this.h = h; this.ch = new Array(w*h).fill(" "); this.col = new Array(w*h).fill(null); this.z = new Float32Array(w*h).fill(-1e9); }
  put(x, y, ch, rgb, z = 0) {
    const ix = Math.round(x), iy = Math.round(y);
    if (ix >= 0 && ix < this.w && iy >= 0 && iy < this.h) {
      const i = iy * this.w + ix;
      if (z >= this.z[i]) { this.z[i] = z; this.ch[i] = ch; this.col[i] = rgb; }
    }
  }
}

// ---------------- Particles ----------------
const R = rng(42);
const ru = (a, b) => a + (b - a) * R();
const parts = { stars: [[0.89,0.09,0,[95,255,175]],[0.11,0.80,2.1,[95,255,175]],[0.14,0.14,4,[130,225,255]]],
  hearts: [{x:0.11,y:0.22,s:0.018,p:0.2},{x:0.12,y:0.72,s:0.015,p:2.4},{x:0.87,y:0.60,s:0.017,p:4.1},{x:0.84,y:0.24,s:0.013,p:1.3}],
  sparkles: [], drifters: [], petals: [], fireflies: [], grass: [] };
for (let i = 0; i < 42; i++) {
  const sx = ru(0.03, 0.97), sy = ru(0.04, 0.90);
  if (sx > 0.26 && sx < 0.74 && sy > 0.24 && sy < 0.76) continue;
  parts.sparkles.push([sx, sy, ru(0, 6.28), ".o*+"[Math.floor(R() * 4)]]);
}
for (let i = 0; i < 10; i++) parts.drifters.push({ x: ru(0.05,0.95), y: ru(0.05,0.82), vx: ru(0.008,0.018), p: ru(0,6.28), ch: "<>o"[Math.floor(R()*3)], col: [[255,115,155],[255,175,215],[255,210,95]][Math.floor(R()*3)] });
for (let i = 0; i < 16; i++) parts.petals.push({ x: ru(0.04,0.96), sp: ru(0.035,0.07), spawn: 2.5 + i*0.55, sway: ru(0.02,0.05), p: ru(0,6.28), tilt: ru(0.8,1.6), tone: R() });
for (let i = 0; i < 9; i++) parts.fireflies.push({ cx: ru(0.08,0.92), cy: ru(0.15,0.85), ax: ru(0.03,0.09), ay: ru(0.03,0.08), fx: ru(0.25,0.6), fy: ru(0.3,0.7), p: ru(0,6.28) });
for (let i = 0; i < 64; i++) parts.grass.push([ru(0, TAU), 0.10 + 0.78 * sqrt(R()), ru(0.05, 0.15), ru(0, 6.28)]);

// ---------------- Flower parts ----------------
function stem(g, p0, p1, p2, prog, V) {
  if (prog <= 0) return;
  const steps = Math.max(22, Math.floor(V.unit * 2.6)), maxI = Math.floor(steps * clamp(prog, 0, 1));
  let px = null, py = null;
  for (let i = 0; i <= maxI; i++) {
    const t = i / steps, mt = 1 - t, q = k => mt*mt*p0[k] + 2*mt*t*p1[k] + t*t*p2[k];
    const [sx, sy, rz, sh] = proj(q(0), q(1), q(2), V);
    let ch = "|";
    if (px !== null) { const sl = (sx - px) / (abs(sy - py) + 1e-4); ch = sl < -0.6 ? "\\" : sl > 0.6 ? "/" : (i % 4 ? "|" : "i"); }
    px = sx; py = sy;
    const rgb = scale(mix([70,165,110], [140,235,165], t), sh);
    g.put(sx, sy, ch, rgb, 5 + rz);
    if (t < 0.5) g.put(sx + 1, sy, ch, scale(rgb, 0.8), 4.98 + rz);
  }
}

function foliage(g, base, prog, t, V) {
  if (prog <= 0.01) return;
  const rays = 22, steps = Math.max(14, Math.floor(V.unit * 1.35));
  for (let idx = 0; idx < rays; idx++) {
    const ang = idx / rays * TAU, ca = cos(ang), sa = sin(ang);
    const topR = lerp(0.42, 0.62, (idx % 3) / 2) * prog, topY = base[1] - lerp(0.62, 0.80, idx % 2) * prog;
    let px = null, py = null;
    for (let s = 1; s <= steps; s++) {
      const u = s / steps, r = topR * u ** 0.92;
      const [sx, sy, rz, sh] = proj(base[0] + ca*r, lerp(base[1], topY, u), base[2] + sa*r, V);
      let ch = "|";
      if (px !== null) { const sl = (sx - px) / (abs(sy - py) + 1e-4); ch = sl < -0.5 ? "\\" : sl > 0.5 ? "/" : (s % 2 ? "|" : "+"); }
      px = sx; py = sy;
      let rgb = scale(mix([75,170,112], [145,240,170], u), sh);
      if (mod(idx*7 + s*13 + Math.floor(t*3), 27) === 0) rgb = scale([195,255,200], sh);
      g.put(sx, sy, ch, rgb, 4.95 + rz);
    }
  }
  const nl = 8, ls = Math.max(14, Math.floor(V.unit * 1.5)), maxS = Math.floor(ls * prog);
  for (let i = 0; i < nl; i++) {
    const ang = i / nl * TAU + 0.25, ca = cos(ang), sa = sin(ang), pa = -sa, psa = ca;
    const reach = i % 2 === 0 ? 0.84 : 0.68, tipY = i % 2 === 0 ? -0.08 : 0.14;
    const p0 = [base[0] + ca*0.06, base[1] - 0.18, base[2] + sa*0.06];
    const p1 = [base[0] + ca*reach*0.58, lerp(p0[1], tipY, 0.55) - 0.14, base[2] + sa*reach*0.58];
    const p2 = [base[0] + ca*reach, tipY, base[2] + sa*reach];
    for (let s = 0; s <= maxS; s++) {
      const u = s / ls, mt = 1 - u, q = k => mt*mt*p0[k] + 2*mt*u*p1[k] + u*u*p2[k];
      const hw = sin(u * PI) * 0.06, bc = mix([65,175,110], [155,245,160], u);
      for (const wi of [-1, 0, 1]) {
        if (wi !== 0 && hw < 0.022) continue;
        const off = wi * hw;
        const [sx, sy, rz, sh] = proj(q(0) + pa*off, q(1), q(2) + psa*off, V);
        const ch = (wi === 0 && hw > 0.032) ? "=" : (u > 0.72 ? "~" : "-");
        g.put(sx, sy, ch, scale(bc, sh * (wi === 0 ? 1 : 0.85)), 5.05 + rz);
      }
    }
  }
}

function lily(g, center, axis, size, bloom, t, V, accent) {
  if (bloom <= 0.03) return;
  const [fx, fy, fz] = center, fwd = norm(axis);
  const right = norm(cross(abs(fwd[1]) > 0.94 ? [0,0,1] : [0,-1,0], fwd)), up = norm(cross(fwd, right));
  const pl = size * (0.34 + 0.66 * bloom) * (1 + 0.018 * sin(t * 1.6 + size * 20)), maxW = pl * (0.18 + 0.14 * bloom);
  const inner = accent ? pal.ai : pal.i, edge = accent ? pal.ae : pal.e;
  const us = clamp(Math.floor(pl * V.unit * 2.5), 11, 22), tick = Math.floor(t * 4);
  for (let k = 0; k < 6; k++) {
    const phi = k * PI / 3, cp = cos(phi), sp = sin(phi), isIn = k % 2 === 1;
    const rad = [0,1,2].map(a => right[a]*cp + up[a]*sp), tan = [0,1,2].map(a => -right[a]*sp + up[a]*cp);
    const pLen = pl * (isIn ? 0.96 : 1.04), pW = maxW * (isIn ? 1.06 : 0.94), off = isIn ? 0.018 : 0;
    for (let ui = 1; ui <= us; ui++) {
      const u = ui / us, rd = pLen * lerp(0.22, 1.04, bloom) * u ** 0.88;
      const fd = pLen * (0.52 * sin(u*PI*0.78) * (1.12 - 0.35*bloom) - 0.25 * bloom * u ** 2.6) + off;
      const hw = pW * u ** 0.62 * (1 - u) ** 0.82 * 2.85;
      const nh = clamp(Math.ceil(hw * V.unit * ASPECT * 1.15), 1, 7);
      const b = [fx + rad[0]*rd + fwd[0]*fd, fy + rad[1]*rd + fwd[1]*fd, fz + rad[2]*rd + fwd[2]*fd];
      for (let vi = -nh; vi <= nh; vi++) {
        const v = vi / nh, er = abs(v), cup = -0.14 * hw * (1 - v*v);
        const [sx, sy, rz, sh] = proj(b[0] + tan[0]*v*hw + fwd[0]*cup, b[1] + tan[1]*v*hw + fwd[1]*cup, b[2] + tan[2]*v*hw + fwd[2]*cup, V);
        let rgb, ch;
        if (u < 0.22) { rgb = mix(pal.t, inner, u / 0.22); ch = u < 0.13 ? "+" : "o"; }
        else {
          const rim = clamp(er * 0.85 + Math.max(0, u - 0.66) * 1.55, 0, 1);
          rgb = rim < 0.5 ? mix(inner, pal.m, rim * 2) : mix(pal.m, edge, (rim - 0.5) * 2);
          const hs = mod(Math.floor(u*13)*37 + Math.floor((v+2)*11)*19 + k*7, 13);
          if (u >= 0.23 && u <= 0.66 && er < 0.58 && hs === 0) { rgb = pal.f; ch = ":"; }
          else if (u > 0.88) ch = mod(ui + vi + tick, 7) === 0 ? "*" : ".";
          else if (er > 0.72) ch = mod(ui + vi, 2) === 0 ? "o" : "0";
          else if (er < 0.24) { rgb = mix(rgb, WHITE, 0.25); ch = u < 0.62 ? "O" : "o"; }
          else ch = mod(ui + vi, 3) === 0 ? "0" : "o";
        }
        if (mod(ui*19 + (vi+9)*31 + k*13 + tick, 73) === 0) { rgb = mix(rgb, WHITE, 0.5); ch = "*"; }
        if (sin(sx*0.16 - sy*0.09 - t*2) > 0.965) rgb = mix(rgb, WHITE, 0.3);   // light sheen
        g.put(sx, sy, ch, scale(rgb, sh), 5.1 + rz + (isIn ? 0.02 : 0));
      }
    }
  }
  const c = proj(fx + fwd[0]*0.03, fy + fwd[1]*0.03, fz + fwd[2]*0.03, V);
  g.put(c[0], c[1], "@", scale(pal.t, c[3]), 5.16 + c[2]);
  const sprog = smooth((bloom - 0.35) / 0.65);
  if (sprog > 0.05) {
    const sl = pl * 0.62 * sprog, ss = Math.max(5, Math.floor(sl * V.unit * 1.8));
    for (let i = 0; i < 5; i++) {
      const ang = i * TAU / 5 + 0.35 + sin(t*1.8 + i) * 0.06, ca = cos(ang), sa = sin(ang);
      const sr = [0,1,2].map(a => right[a]*ca + up[a]*sa);
      for (let st = 1; st <= ss; st++) {
        const u = st / ss, fdd = sl * 0.92 * u, rdd = sl * 0.36 * u ** 1.4;
        const [sx, sy, rz, sh] = proj(fx + fwd[0]*fdd + sr[0]*rdd, fy + fwd[1]*fdd + sr[1]*rdd, fz + fwd[2]*fdd + sr[2]*rdd, V);
        if (st < ss) g.put(sx, sy, "|", scale(mix(pal.t, [245,250,220], u), sh), 5.18 + rz);
        else {
          const pu = 0.5 + 0.5 * sin(t*4.5 + i*1.7);
          g.put(sx, sy, pu > 0.45 ? "0" : "@", scale(mix(pal.a, pal.ah, pu), sh), 5.22 + rz);
        }
      }
    }
  }
}

function bud(g, center, axis, size, growth, V) {
  if (growth <= 0.05) return;
  const fwd = norm(axis), len = size * growth, steps = Math.max(8, Math.floor(len * V.unit * 2.2));
  for (let i = 0; i <= steps; i++) {
    const u = i / steps;
    const [sx, sy, rz, sh] = proj(center[0] + fwd[0]*len*u, center[1] + fwd[1]*len*u, center[2] + fwd[2]*len*u, V);
    let rgb, ch;
    if (u < 0.35) { rgb = [120,225,145]; ch = "o"; }
    else if (u < 0.82) { rgb = mix(pal.i, pal.e, (u - 0.35) / 0.47); ch = "0"; }
    else { rgb = pal.e; ch = fwd[1] < -0.5 ? "^" : "*"; }
    rgb = scale(rgb, sh);
    g.put(sx, sy, ch, rgb, 5.12 + rz);
    if (u > 0.2 && u < 0.65) g.put(sx + 1, sy, "o", scale(rgb, 0.85), 5.10 + rz);
  }
}

// ---------------- Scene extras ----------------
function halo(g, t, V, strength, bgRows) {
  if (strength <= 0.01) return;
  const rxc = V.unit * ASPECT * 1.15, ryc = V.unit;
  for (let y = Math.max(0, Math.floor(V.cy - ryc)); y < Math.min(g.h, Math.floor(V.cy + ryc) + 1); y++) {
    const dy = (y - V.cy) / ryc;
    for (let x = Math.max(0, Math.floor(V.cx - rxc)); x < Math.min(g.w, Math.floor(V.cx + rxc) + 1); x++) {
      if (((Math.imul(x, 73856093) ^ Math.imul(y, 19349663)) >>> 0) % 11) continue;
      const dx = (x - V.cx) / rxc, d = sqrt(dx*dx + dy*dy);
      if (d >= 1) continue;
      const fall = (1 - d) ** 1.4, pulse = 0.5 + 0.5 * sin(t*1.3 + x*0.37 + y*0.91);
      const amt = clamp((0.10 + 0.55 * fall * pulse) * strength, 0, 1);
      g.put(x, y, fall * pulse > 0.45 ? ":" : ".", mix(bgRows[y], pal.ai, amt * 0.6), 0.3);
    }
  }
}

function ground(g, base, prog, t, V) {
  if (prog <= 0.02) return;
  for (let ring = 0; ring < 3; ring++) {
    const rr = (0.34 + ring * 0.24) * prog, n = 20 + ring * 14, spin = (0.15 + ring * 0.05) * (ring % 2 === 0 ? 1 : -1);
    for (let i = 0; i < n; i++) {
      const a = i / n * TAU + t * spin;
      const [sx, sy, rz, sh] = proj(base[0] + cos(a)*rr, base[1] + 0.03, base[2] + sin(a)*rr, V);
      const tw = 0.5 + 0.5 * sin(t*2 + i*0.7 + ring);
      g.put(sx, sy, tw > 0.92 ? "*" : tw < 0.6 ? "." : ":", scale(mix(pal.ai, pal.e, tw), sh * (0.6 - ring * 0.12)), 3 + rz);
    }
  }
  for (const [ang, rad, hgt, ph] of parts.grass) {
    const lean = sin(t*1.7 + ph) * 0.04, bx = base[0] + cos(ang)*rad, bz = base[2] + sin(ang)*rad;
    for (let s = 1; s <= 3; s++) {
      const u = s / 3;
      const [sx, sy, rz, sh] = proj(bx + lean*u, base[1] - hgt*u*prog, bz, V);
      const ch = s === 3 ? "'" : lean > 0.015 ? "/" : lean < -0.015 ? "\\" : "|";
      g.put(sx, sy, ch, scale(mix([55,150,100], [150,240,170], u), sh), 5.06 + rz);
    }
  }
}

function ambient(g, t) {
  const w = g.w, h = g.h;
  for (const [sx, sy, ph, ch] of parts.sparkles) {
    const tw = 0.45 + 0.55 * sin(t*2.4 + ph);
    if (tw < 0.25) continue;
    const x = Math.floor(sx*w), y = Math.floor(sy*h);
    g.put(x, y, ch, scale([220,232,250], tw), 1);
    if (ch === "o" && tw > 0.6) g.put(x + 2, y, ".", scale([185,200,225], tw*0.75), 1);
  }
  for (const [sx, sy, ph, bc] of parts.stars) {
    const pu = 0.55 + 0.45 * sin(t*3 + ph), x = Math.floor(sx*w), y = Math.floor(sy*h);
    const hi = mix(bc, WHITE, pu*0.45), arm = scale(bc, 0.6 + 0.4*pu);
    g.put(x, y, "+", hi, 1.5);
    if (pu > 0.35) { g.put(x, y-1, "|", arm, 1.5); g.put(x, y+1, "|", arm, 1.5); g.put(x-2, y, "-", arm, 1.5); g.put(x+2, y, "-", arm, 1.5); }
    if (pu > 0.82) { g.put(x-1, y, ".", hi, 1.4); g.put(x+1, y, ".", hi, 1.4); }
  }
  for (const o of parts.hearts) {
    const yn = mod(o.y - t*o.s, 0.88) + 0.04, xn = o.x + sin(t*1.1 + o.p) * 0.015;
    const x = Math.floor(xn*w), y = Math.floor(yn*h), col = scale([255,110,170], 0.75 + 0.25*sin(t*3.2 + o.p));
    "(V)".split("").forEach((c, i) => g.put(x - 1 + i, y, c, col, 2));
    g.put(x, y + 1, "V", scale(col, 0.9), 2);
  }
  for (const d of parts.drifters) g.put(Math.floor(mod(d.x + t*d.vx, 1) * w), Math.floor((d.y + sin(t*1.6 + d.p) * 0.02) * h), d.ch, d.col, 1.3);
  for (const p of parts.petals) {
    const age = t - p.spawn;
    if (age < 0) continue;
    const yn = mod(age * p.sp, 1.08) - 0.04, xn = p.x + sin(age*0.8 + p.p) * p.sway;
    const fade = clamp(Math.min(yn*6, (1.04 - yn)*6), 0, 1);
    if (fade <= 0) continue;
    g.put(Math.floor(xn*w), Math.floor(yn*h), ")~(-"[Math.floor(age*2.2*p.tilt + p.p) % 4], scale(mix(pal.m, pal.e, p.tone), 0.85*fade), 2.5);
  }
  for (const f of parts.fireflies) {
    const fx = f.cx + f.ax * sin(t*f.fx*2 + f.p), fy = f.cy + f.ay * sin(t*f.fy*2 + f.p*1.7);
    const pu = 0.5 + 0.5 * sin(t*1.9 + f.p*3);
    if (pu < 0.18) continue;
    const x = Math.floor(fx*w), y = Math.floor(fy*h), col = mix([190,255,150], [255,245,150], f.p / 6.29);
    g.put(x, y, pu > 0.75 ? "*" : pu > 0.45 ? "+" : ".", scale(col, 0.5 + 0.5*pu), 2.2);
    if (pu > 0.7) { g.put(x-1, y, ".", scale(col, 0.35), 2.1); g.put(x+1, y, ".", scale(col, 0.35), 2.1); }
  }
  if (t > 4) {                       // occasional shooting star
    const cycle = Math.floor((t - 4) / 9), prog = ((t - 4) % 9) / 1.2;
    if (prog < 1) {
      const r = rng(cycle * 97 + 5), x0 = 0.55 + 0.4 * r(), y0 = 0.04 + 0.18 * r();
      for (let k = 0; k < 7; k++) {
        const pp = prog - k * 0.03;
        if (pp < 0) continue;
        g.put((x0 - pp*0.45) * w, (y0 + pp*0.32) * h, k === 0 ? "*" : k < 3 ? "+" : ".", scale([235,245,255], (1 - k/7) * (1 - prog**3)), 1.8);
      }
    }
  }
}

function message(g, text, t, reveal, alpha, row, bright, bgRows) {
  if (!text || reveal <= 0 || alpha <= 0) return;
  const y = row, sx = Math.floor(g.w / 2) - Math.floor(text.length / 2), bg = bgRows[y];
  const pulse = 0.82 + 0.18 * sin(t * 2.8);
  const base = mix(bg, mix(scale(pal.msg, pulse), [255,235,245], bright), alpha);
  const dim = mix(bg, scale(pal.msg, 0.45 * pulse), alpha), hi = mix(bg, [255,230,245], alpha);
  for (let i = 0; i < text.length; i++) {
    if (mod(i + Math.floor(t*5), 4) !== 0) {
      if (y - 1 >= 0) g.put(sx + i, y - 1, i % 3 === 0 ? ":" : ".", dim, 20);
      if (y + 1 < g.h) g.put(sx + i, y + 1, i % 2 === 0 ? "." : ":", dim, 20);
    }
  }
  const shown = text.slice(0, Math.floor(text.length * clamp(reveal, 0, 1)));
  for (let i = 0; i < shown.length; i++) g.put(sx + i, y, shown[i], mod(i - Math.floor(t*8), 9) === 0 ? mix(base, hi, 0.35) : base, 20.5);
}

// ---------------- Bouquet layout ----------------
const lilies = [[[0, -0.45, 0], [0.18, -0.92, 0.34], 0.31, 1.3, false]];
for (let i = 0; i < 3; i++) {
  const a = i * TAU / 3 + 0.35;
  lilies.push([[cos(a)*0.47, -0.25, sin(a)*0.47], [cos(a)*0.72, -0.68, sin(a)*0.72], 0.26, 1.7 + i*0.18, false]);
}
for (let i = 0; i < 3; i++) {
  const a = i * TAU / 3 + 0.35 + PI / 3;
  lilies.push([[cos(a)*0.64, 0.02, sin(a)*0.64], [cos(a)*0.86, -0.46, sin(a)*0.86], 0.22, 2.2 + i*0.18, true]);
}
const buds = [];
for (let i = 0; i < 3; i++) {
  const a = i * TAU / 3 + 0.35 + PI / 3;
  buds.push([[cos(a)*0.27, -0.52, sin(a)*0.27], [cos(a)*0.42, -0.90, sin(a)*0.42], 0.18, 1.5 + i*0.12]);
}

// ---------------- Main loop ----------------
const cvs = document.getElementById("c"), ctx = cvs.getContext("2d");
let W, H, cw, rh, ox, oy, bgRows = [], vw, vh;
function resize() {
  const dpr = window.devicePixelRatio || 1;
  vw = window.innerWidth; vh = window.innerHeight;
  cvs.width = vw * dpr; cvs.height = vh * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const fs = clamp(Math.floor(vw / 90), 9, 16);
  ctx.font = fs + 'px Consolas, "Courier New", monospace';
  ctx.textBaseline = "middle";
  cw = ctx.measureText("M").width; rh = cw * 2;     // cells are twice as tall as wide
  W = Math.max(40, Math.floor(vw / cw)); H = Math.max(20, Math.floor(vh / rh));
  ox = (vw - W * cw) / 2; oy = (vh - H * rh) / 2;
  bgRows = [];
  for (let y = 0; y < H; y++) bgRows.push(mix(BG_TOP, BG_BOT, smooth(y / Math.max(1, H - 1))));
}
window.addEventListener("resize", resize);
resize();

let start = null;
function frame(now) {
  if (start === null) start = now;
  const t = (now - start) / 1000;
  const g = new Grid(W, H);
  const rot = t * ROT_SPEED;
  const V = { rc: cos(rot), rs: sin(rot), cx: W * 0.5, cy: H * 0.48, unit: Math.min((W - 6) / 3.6, (H - 5) / 1.85) };
  const bob = sin(t * 1.4) * 0.015, base = [0, BASE_Y, 0];
  wind = 0.55 * sin(t * 0.75) + 0.25 * sin(t * 1.9 + 1.3);
  const stemP = smooth(t / 1.7), leafP = smooth((t - 0.35) / 1.8), msgP = smooth((t - 2.4) / 1.7);

  halo(g, t, V, smooth((t - 1) / 3), bgRows);
  ambient(g, t);
  ground(g, base, leafP, t, V);
  foliage(g, base, leafP, t, V);
  for (const [[bx, by, bz], ax, sz, dl] of buds) {
    const tg = [bx, by + bob, bz];
    stem(g, base, [bx*0.42, lerp(base[1], tg[1], 0.52), bz*0.42], tg, stemP, V);
    bud(g, tg, ax, sz, smooth((t - dl) / 1.1), V);
  }
  for (const [[lx, ly, lz], ax, sz, dl, acc] of lilies) {
    const tg = [lx, ly + bob, lz];
    stem(g, base, [lx*0.38, lerp(base[1], tg[1], 0.48), lz*0.38], tg, stemP, V);
    lily(g, tg, ax, sz, smooth((t - dl) / 1.4), t, V, acc);
  }
  message(g, MESSAGE, t, msgP, 1, H - 2, 0, bgRows);

  // draw
  for (let y = 0; y < H; y++) {
    const b = bgRows[y];
    ctx.fillStyle = `rgb(${b[0]},${b[1]},${b[2]})`;
    ctx.fillRect(0, oy + y * rh, vw, rh + 1);
  }
  ctx.fillStyle = `rgb(${bgRows[0][0]},${bgRows[0][1]},${bgRows[0][2]})`;
  ctx.fillRect(0, 0, vw, oy + 1);
  let last = "";
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const i = y * W + x, c = g.ch[i], col = g.col[i];
      if (c === " " || !col) continue;
      const s = `rgb(${col[0]},${col[1]},${col[2]})`;
      if (s !== last) { ctx.fillStyle = s; last = s; }
      ctx.fillText(c, ox + x * cw, oy + y * rh + rh / 2);
    }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
